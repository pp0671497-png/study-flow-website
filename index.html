<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c63ff"><link rel="manifest" href="manifest.json"><title>StudyFlow 4.0</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">✦</div><div><b>StudyFlow</b><small>STUDENT PRODUCTIVITY</small></div></div><nav id="nav"><div class="nav-label">WORKSPACE</div><button class="active" data-page="dashboard">⌂ <span>Dashboard</span></button><button data-page="tasks">☑ <span>Tasks</span></button><button data-page="planner">▦ <span>Smart Planner</span></button><button data-page="calendar">▣ <span>Calendar</span></button><button data-page="focus">◷ <span>Focus Studio</span></button><div class="nav-label">ACADEMICS</div><button data-page="subjects">▤ <span>Subjects & Exams</span></button><button data-page="notes">✎ <span>Knowledge Hub</span></button><button data-page="revision">◇ <span>Revision Cards</span></button><div class="nav-label">PERSONAL</div><button data-page="wellness">♡ <span>Wellness</span></button><button data-page="assistant">✧ <span>Study Assistant</span></button><button data-page="analytics">▥ <span>Analytics</span></button><button data-page="settings">⚙ <span>Settings & Backup</span></button></nav><div class="profile"><div class="avatar">S</div><div><b>Student</b><small id="levelText">Level 1 learner</small></div><div class="xp" id="xpMini">0 XP</div></div></aside><main><header class="topbar"><div><div class="eyebrow" id="dateLine"></div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="icon" id="themeBtn" title="Toggle theme">◐</button><button class="secondary" id="cmdBtn">⌘K</button><button class="primary" id="quickAdd">＋ New task</button></div></header><div id="content"></div></main></div>
<div class="modal-overlay hidden" id="taskModal"><div class="modal"><button class="close" id="closeTask">×</button><h2 id="taskModalTitle">Create task</h2><form id="taskForm"><input type="hidden" id="taskId"><label>Task name<input id="taskTitle" required maxlength="120" placeholder="What do you need to do?"></label><div class="two"><label>Subject<input id="taskSubject" placeholder="e.g. DBMS"></label><label>Due date<input id="taskDue" type="date"></label></div><div class="two"><label>Priority<select id="taskPriority"><option>Medium</option><option>High</option><option>Low</option></select></label><label>Estimated minutes<input id="taskEstimate" type="number" min="1" max="1440" value="30"></label></div><div class="two"><label>Difficulty<select id="taskDifficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></label><label>Repeat<select id="taskRepeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></label></div><label>Notes<textarea id="taskNotes" rows="3" placeholder="Extra details..."></textarea></label><button class="primary wide">Save task</button></form></div></div>
<div class="modal-overlay hidden" id="commandModal"><div class="command"><input id="commandInput" placeholder="Search StudyFlow or jump to a page…"><div id="commandResults"></div></div></div><div class="toast" id="toast"></div><script type="module" src="app.js"></script></body></html>
